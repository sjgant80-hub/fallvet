<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◊ FallVet · sovereign UK veterinary practice management · RCVS · PSS · CD register · cascade</title>
<meta name="description" content="Sovereign UK veterinary practice management for 1-10 clinician independent vets. RCVS-regulated, PSS-accredited (Core/GP/Hospital). Multi-vet, multi-client, animal records, consult notes (append-only, signed), prescriptions, controlled drug register (Schedule 2/3 with two-witness), vaccinations, microchips, AHC, PSS evidence. Not a PACS, lab integration or claims portal. Sovereign — data stays on device.">
<meta name="prime" content="947">

<style>
:root{
 --void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;
 --line:#2a2934;--line-soft:#1f1e28;
 --cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;
 --brass:#c8974a;--amber:#ff8c00;--ox:#a8412a;--ox-warm:#c8553a;
 --green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;
 --serif:Georgia,'Libre Baskerville',ui-serif,serif;
 --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
input[type=number],input[type=date]{font-family:var(--mono)}
a{color:var(--brass)}a:hover{color:var(--amber)}

.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--ox-warm));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--void)}
.brand .name{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0.02em}
.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}

.client-pill{display:flex;align-items:center;gap:8px;padding:0 14px;height:100%;border-right:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--cream-dim)}
.client-pill:hover{background:var(--ink);color:var(--cream)}
.client-pill .who{font-family:var(--serif);font-size:13px;color:var(--brass)}
.client-pill .meta{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase}

nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}
nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}
nav.tabs button:hover{background:var(--ink);color:var(--cream)}
nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}

.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}
.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}
.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
.tool-btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.tool-btn.primary:hover{background:var(--amber);border-color:var(--amber)}
.tool-btn.t3{border-color:var(--blue);color:var(--blue)}

.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100dvh - 48px)}
aside.sidebar{background:var(--void-2);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 60px;display:flex;flex-direction:column;gap:10px}
.sidebar h4{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px;padding:0 4px}
.sidebar-search{display:flex;flex-direction:column;gap:6px}
.sidebar-search input,.sidebar-search select{font-size:12px;padding:6px 8px}
.client-list{display:flex;flex-direction:column;gap:3px}
.client-card{padding:9px 11px;border-radius:3px;cursor:pointer;border:1px solid transparent;border-left:3px solid var(--line);background:var(--ink);transition:all 0.1s}
.client-card:hover{background:var(--ink-2);border-left-color:var(--brass)}
.client-card.active{background:var(--ink-2);border-left-color:var(--brass);border-color:var(--line)}
.client-card .nm{font-family:var(--serif);font-size:13px;color:var(--cream);font-weight:600}
.client-card .sub{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.client-card .sub .tag{padding:1px 5px;border-radius:2px;background:var(--void);color:var(--cream-dim);font-size:9px}
.client-card .sub .tag.due{background:var(--ox);color:var(--cream)}
.client-card .sub .tag.amber{background:var(--amber);color:var(--void)}
.client-card .sub .tag.species{color:var(--brass);border:1px solid var(--line)}
.empty-state{padding:18px;text-align:center;color:var(--cream-muted);font-size:12px;font-style:italic}

main{padding:18px 22px 60px;overflow-y:auto;max-width:1280px;margin:0 auto;width:100%}

.disclaimer{background:rgba(168,65,42,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--cream)}
.disclaimer strong{color:var(--brass)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:0.01em}
.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}
.section-h .actions{display:flex;gap:6px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px;color:var(--cream);letter-spacing:0.01em}
.card h3 .meta{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.1em;margin-left:8px}

.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kpi:last-child{border-bottom:none}
.kpi .l{color:var(--cream-dim)}
.kpi .v{font-family:var(--mono);color:var(--cream);font-weight:500}
.kpi .v.green{color:var(--green)}.kpi .v.red{color:var(--red)}.kpi .v.amber{color:var(--amber)}.kpi .v.brass{color:var(--brass)}.kpi .v.blue{color:var(--blue)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.row.r4{grid-template-columns:1fr 1fr 1fr 1fr}
.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}

.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent;letter-spacing:0.04em;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.btn.primary:hover{background:var(--amber);border-color:var(--amber);color:var(--void)}
.btn.danger{border-color:var(--ox);color:var(--ox-warm)}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,0.08)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{border-color:var(--line);color:var(--cream-dim)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
td.r{text-align:right;font-family:var(--mono)}
td.mono{font-family:var(--mono);font-size:11px}
tr.total td{font-weight:600;border-top:1px solid var(--brass);border-bottom:none;padding-top:10px}
tr.total td.r{color:var(--brass)}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--ink)}
tr.warn{background:rgba(255,140,0,0.08)}
tr.crit{background:rgba(168,65,42,0.12)}

.tag{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass);margin-right:4px}
.tag.amber{border-color:var(--amber);color:var(--amber)}
.tag.green{border-color:var(--green);color:var(--green)}
.tag.red{border-color:var(--red);color:var(--red)}
.tag.blue{border-color:var(--blue);color:var(--blue)}
.tag.dim{border-color:var(--line);color:var(--cream-muted)}
.tag.ox{border-color:var(--ox);color:var(--ox-warm)}

.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}
.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}
.msg.user{background:var(--ink);align-self:flex-end;border-bottom-right-radius:2px}
.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--brass);align-self:flex-start;border-bottom-left-radius:2px}
.msg.bot .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.08em;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;padding:11px 14px}

.tabs-inner{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs-inner button{padding:8px 14px;font-size:12px;color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap}
.tabs-inner button.active{color:var(--brass);border-bottom-color:var(--brass)}
.tabs-inner button:hover{color:var(--cream)}

.note{background:var(--ink);padding:10px 12px;border-radius:3px;border-left:3px solid var(--brass);margin-bottom:8px}
.note .meta{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;margin-bottom:4px}
.note .body{font-size:13px;white-space:pre-wrap}
.note .hash{font-family:var(--mono);font-size:9px;color:var(--cream-muted);margin-top:4px;letter-spacing:0.04em;word-break:break-all}

.palette-bg,.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:900;backdrop-filter:blur(4px)}
.palette-bg.open,.modal-bg.open{display:flex}
.modal-bg{align-items:center;padding:18px}
.palette{background:var(--void-2);border:1px solid var(--brass);border-radius:5px;width:min(640px,90%);box-shadow:0 18px 50px rgba(0,0,0,0.7);overflow:hidden}
.palette-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.palette-hd .glyph{font-family:var(--serif);font-size:18px;color:var(--brass)}
.palette-hd input{flex:1;border:none;background:transparent;font-size:15px;padding:4px}
.palette-bd{max-height:50vh;overflow:auto;padding:8px}
.palette-row{padding:9px 12px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.palette-row:hover{background:var(--ink)}
.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.onboard{max-width:580px;margin:5vh auto;padding:36px 32px;background:var(--void-2);border:1px solid var(--brass);border-radius:6px}
.onboard h1{font-family:var(--serif);font-size:28px;color:var(--brass);margin-bottom:6px}
.onboard .lead{color:var(--cream-dim);margin-bottom:20px;font-size:13px}
.onboard .step{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px}

.drawer-toggle{display:none;padding:0 12px;height:100%;align-items:center;border-right:1px solid var(--line);cursor:pointer;color:var(--brass);font-size:18px}

.weight-chart{height:140px;width:100%;margin-top:8px;background:var(--ink);border-radius:3px;padding:6px;position:relative}
.weight-chart svg{width:100%;height:100%}

.species-icon{display:inline-block;width:22px;text-align:center;font-size:14px}

@media (max-width:880px){
 .drawer-toggle{display:flex}
 .layout{grid-template-columns:1fr}
 aside.sidebar{position:fixed;top:48px;left:-320px;bottom:0;width:300px;z-index:50;transition:left 0.2s;box-shadow:0 0 30px rgba(0,0,0,0.6)}
 aside.sidebar.open{left:0}
 nav.tabs button{padding:0 10px;font-size:11px}
 main{padding:14px 14px 50px}
 .row,.row.r3,.row.r4{grid-template-columns:1fr}
 .brand .seal{display:none}
}
</style>

  // ─── State ──────────────────────────────────────────────────────────
  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];
  const emptyKeys = () => ({ text: {}, image: {}, video: {}, tts: {}, stt: {} });
  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {
      const held = c.keys && c.keys[m] && typeof c.keys[m] === 'object' ? c.keys[m] : {};
      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;
    if (!remember) delete c.keys;
    return { config: c, secrets: secrets, moved: remember ? 0 : moved };
  }
  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);
    delete out.keys;
    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };
    }
    return out;
  }
  const BOOT = (function () {
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); } catch (e) { stored = {}; }
    return configFrom(stored);
  })();
  const STATE = {
    config: BOOT.config,
    secrets: BOOT.secrets,   // the keys: this tab only, unless remember_keys
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null, light: null, stats: { sent: 0, admitted: 0, legacy: 0, refused: {} } },
    lastUsage: null,
    ask: { opening: null, talk: [], last: null },   // the talk about this page: its opening, kept identical, and its turns
  };

  function saveConfig() { try { localStorage.setItem('fall-kit.config', JSON.stringify(storedForm(STATE.config, STATE.secrets))); } catch (e) {} }
  if (BOOT.moved) saveConfig();   // keys stored the old way leave shared storage now; they stay usable in this tab
  function getKey(modality, providerKey) { return (STATE.secrets[modality] && STATE.secrets[modality][providerKey]) || ''; }
  function getModel(modality, providerKey, registry) {
    return (STATE.config.models && STATE.config.models[modality] && STATE.config.models[modality][providerKey]) || registry[providerKey]?.default;
  }
  function setKey(modality, providerKey, key, model) {
    STATE.secrets[modality] = STATE.secrets[modality] || {};
    if (key) STATE.secrets[modality][providerKey] = key;
    STATE.config.models = STATE.config.models || emptyKeys();
    STATE.config.models[modality] = STATE.config.models[modality] || {};
    if (model) STATE.config.models[modality][providerKey] = model;
    saveConfig();
  }
  function forgetKeys() { STATE.secrets = emptyKeys(); STATE.config.remember_keys = false; saveConfig(); renderAiChip(); }

  // ─── DOM helpers ────────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ────────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }
  function activeTextProvider() { return STATE.config.text_provider || 'anthropic'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      const p = activeTextProvider();
      if (getKey('text', p)) { txt.textContent = 'T3 ' + (TEXT_PROVIDERS[p]?.label.split(' ')[0] || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine; STATE.ai.model = model.id; STATE.ai.ready = true; STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig(); renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ IMAGE · aiImage ═══════════════════════════

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  const MESH_MODULE = '/fall-kit/core/mesh.mjs', MESH_DEVICE = '/fall-kit/core/mesh-device.mjs';
  // v3.2: the LIGHT mesh, loaded from this origin when the mesh is switched on. null = JSON, as before v3.2.
  async function lightMesh() {
    try {
      const [M, D] = await Promise.all([import(MESH_MODULE), import(MESH_DEVICE)]);
      const dev = await D.openDevice();
      const tab = crypto.getRandomValues(new Uint32Array(1))[0];
      return { M, dev, tab, seq: 0, last: new Map() };
    } catch (e) { return null; }
  }
  function meshSend(value) {
    const L = STATE.mesh.light, bc = STATE.mesh.bc;
    if (!L) { bc.postMessage(value); STATE.mesh.stats.sent++; return; }
    L.seq += 1;
    L.M.speak(value, { slot: L.dev.slot, tab: L.tab, seq: L.seq, sign: L.dev.sign }).then((r) => { if (r.ok && STATE.mesh.bc) { STATE.mesh.bc.postMessage(r.bytes); STATE.mesh.stats.sent++; } });
  }
  async function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.active = true;
    STATE.mesh.light = opts.light === false ? null : await lightMesh();
    const st = STATE.mesh.stats;
    STATE.mesh.bc.onmessage = async (e) => {
      const L = STATE.mesh.light;
      if (!L) {
        const m = e.data;
        if (!m || !m.kind || m.peerId === seedId) return;
        if (opts.onMessage) opts.onMessage(m);
        return;
      }
      const r = await L.M.hearMesh(e.data, { slot: L.dev.slot, id: L.dev.id, raw: L.dev.raw, verifyBytes: L.dev.verifyBytes, last: L.last });
      if (!r.ok) { st.refused[r.stage] = (st.refused[r.stage] || 0) + 1; return; }
      if (r.legacy) st.legacy++; else st.admitted++;
      if (r.value.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(Object.assign({}, r.value, r.legacy ? { legacy: true } : { light: true, tab: r.tab }));
    };
    meshSend({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    notify('Mesh active · channel ' + MESH_CHANNEL + (STATE.mesh.light ? ' · LIGHT' : ''), 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    meshSend({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }
  function meshStats() {
    const s = STATE.mesh.stats;
    return { active: STATE.mesh.active, light: !!STATE.mesh.light, tab: STATE.mesh.light ? STATE.mesh.light.tab : null, sent: s.sent, admitted: s.admitted, legacy: s.legacy, refused: Object.assign({}, s.refused) };
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

// ── IDB ──

 const r=indexedDB.open(DB_NAME,DB_VER);
 r.onupgradeneeded=e=>{

 STORES.forEach(s=>{ if(!db.objectStoreNames.contains(s)){

 }});
 };
 r.onsuccess=e=>{DB=e.target.result;res(DB)};
 r.onerror=e=>rej(e.target.error);
 });

function idbDel(store,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbClear(store){return new Promise((res,rej)=>{const r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

async function auditPut(action,reasoning,payload){
 const sealed=await AUDITCHAIN.append(state.audit,{ts:now(),tool:TOOLNAME,clinicianId:state.activeClinicianId||'',action,reasoning:reasoning||'',configVersion:TOOLNAME+'@'+VERSION,payload:payload||{}});
 await idbPut('audit',sealed);
 lastAuditHash=sealed.docHash;
 state.audit.push(sealed);
}
// The check that never existed anywhere in this tool.
async function verifyAudit(expectHead){return AUDITCHAIN.verify(state.audit,expectHead?{expectHead}:null)}
async function loadAudit(){
 state.audit=await idbGetAll('audit');
 if(state.audit.length)lastAuditHash=state.audit[state.audit.length-1].docHash;
}

// ── mesh ──
let chVet=null,chSig=null;
function broadcast(type,payload){try{if(chVet)chVet.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload});if(chSig&&type.indexOf('sync')!==0)chSig.postMessage({v:1,tool:TOOLNAME,type,ts:now()})}catch(e){}}
function meshInit(){
 try{
 chVet=new BroadcastChannel('fall-vet');
 chVet.onmessage=async e=>{
 const m=e.data||{};
 if(m.source===TOOLNAME)return;
 if(m.type==='sync.request'){
 broadcast('sync.snapshot',{firm:state.firm,clinicians:state.clinicians,clients:state.clients,animals:state.animals,consults:state.consults});
 return;
 }
 if(m.type==='sync.snapshot'&&m.payload){
 const p=m.payload;
 if(p.clients){for(const c of p.clients){const e2=await idbGet('clients',c.id);if(!e2||(c.updatedAt||0)>(e2.updatedAt||0)){await idbPut('clients',c)}}}
 if(p.animals){for(const a of p.animals){const e2=await idbGet('animals',a.id);if(!e2||(a.updatedAt||0)>(e2.updatedAt||0)){await idbPut('animals',a)}}}
 if(p.clinicians){for(const c of p.clinicians){const e2=await idbGet('clinicians',c.id);if(!e2||(c.updatedAt||0)>(e2.updatedAt||0)){await idbPut('clinicians',c)}}}
 await loadAll();renderAll();
 return;
 }
 if(m.type==='animal.created'||m.type==='animal.updated'){
 if(m.payload&&m.payload.id){await idbPut('animals',m.payload);await loadAll();renderAll()}
 }
 if(m.type==='client.created'||m.type==='client.updated'){
 if(m.payload&&m.payload.id){await idbPut('clients',m.payload);await loadAll();renderAll()}
 }
 };
 setTimeout(()=>broadcast('sync.request',{}),350);
 }catch(e){}
 try{chSig=new BroadcastChannel('fall-signal')}catch(e){}
}

// ── animal helpers ──
function clientName(c){if(!c)return'—';const n=[c.firstName,c.lastName].filter(Boolean).join(' ');return n||'Unnamed'}
function ownerOf(a){return state.clients.find(c=>c.id===a.clientId)}
function vetById(id){return state.clinicians.find(c=>c.id===id)}
function animalById(id){return state.animals.find(a=>a.id===id)}
function nextVaccDue(a){if(!a.vaccinationHistory||!a.vaccinationHistory.length)return null;const sorted=a.vaccinationHistory.filter(v=>v.nextDueDate).sort((x,y)=>new Date(x.nextDueDate)-new Date(y.nextDueDate));return sorted[0]?sorted[0].nextDueDate:null}
function vaccStatus(a){const due=nextVaccDue(a);if(!due)return{kind:'none',label:'—'};const d=new Date(due).getTime();const days=daysBetween(now(),d);if(days<0)return{kind:'overdue',label:'overdue '+(-days)+'d'};if(days<30)return{kind:'amber',label:'due '+days+'d'};return{kind:'ok',label:'due '+days+'d'}}

function renderSidebar(){
 const q=$('#animalFilter').value.toLowerCase();
 const sp=$('#filterSpecies').value;
 const vet=$('#filterVet').value;
 const due=$('#filterDue').value;
 const age=$('#filterAge').value;
 const vetSel=$('#filterVet');
 if(vetSel&&vetSel.options.length<=1){
 vetSel.innerHTML='<option value="">all vets</option>'+state.clinicians.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
 }
 let list=state.animals.slice();
 if(q)list=list.filter(a=>(a.name||'').toLowerCase().includes(q)||(a.microchipNo||'').toLowerCase().includes(q)||clientName(ownerOf(a)).toLowerCase().includes(q));
 if(sp)list=list.filter(a=>a.species===sp);
 if(vet)list=list.filter(a=>(a.primaryVetId||'')===vet);
 if(due){
 if(due==='vacc-due')list=list.filter(a=>{const s=vaccStatus(a);return s.kind==='overdue'});
 if(due==='vacc-amber')list=list.filter(a=>{const s=vaccStatus(a);return s.kind==='amber'});
 if(due==='chronic')list=list.filter(a=>(a.chronicConditions||[]).length>0);
 if(due==='deceased')list=list.filter(a=>a.deceasedAt);
 }
 if(age){
 list=list.filter(a=>{if(!a.dob)return false;const y=(now()-new Date(a.dob).getTime())/(365.25*86400000);
 if(age==='pup')return y<1;if(age==='young')return y>=1&&y<3;if(age==='adult')return y>=3&&y<8;return y>=8});
 }
 list.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));
 $('#animalCount').textContent=list.length+'/'+state.animals.length;

 }).join(''):'<div class="empty-state">no animals match</div>';
 $('#animalList').innerHTML=html;

function animalWeight(a){
 const hist=(a.weightHistory||[]).slice().sort((x,y)=>x.ts-y.ts);
 const max=Math.max(0.1,...hist.map(w=>w.kg||0));
 const min=Math.min(...hist.map(w=>w.kg||0),max);
 const range=Math.max(0.5,max-min);
 const W=600,H=120,PAD=20;
 const pts=hist.length?hist.map((w,i)=>{const x=PAD+(hist.length>1?i/(hist.length-1):0.5)*(W-2*PAD);const y=H-PAD-((w.kg-min)/range)*(H-2*PAD);return [x,y]}):[];
 const path=pts.length?'M '+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L '):'';
 return '<div class="card"><h3>weight history <button class="btn sm" style="float:right" onclick="addWeight(\''+a.id+'\')">+ add reading</button></h3>'+
 '<div class="weight-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
 (path?'<path d="'+path+'" stroke="var(--brass)" stroke-width="2" fill="none"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="var(--brass)"/>').join(''):'')+
 '</svg></div>'+
 (hist.length?'<table style="margin-top:10px"><thead><tr><th>date</th><th class="r">weight (kg)</th><th>by</th></tr></thead><tbody>'+
 hist.slice().reverse().map(w=>'<tr><td>'+fmtDate(w.ts)+'</td><td class="r">'+w.kg+'</td><td>'+esc((vetById(w.byClinicianId)||{}).name||'—')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty-state">no readings</div>')+
 '</div>';
}

async function addConsultNote(id){
 const body=$('#cs_newNote').value.trim();if(!body){toast('empty note');return}
 const c=await idbGet('consults',id);
 const ts=now();const h=await sha256(ts+state.activeClinicianId+body+(c.notes&&c.notes.length?c.notes[c.notes.length-1].sha256:''));
 c.notes=c.notes||[];c.notes.push({ts,by:state.activeClinicianId,body,sha256:h});
 await idbPut('consults',c);await auditPut('consult.note.appended','signed note',{id,hash:h});
 await loadAll();modalConsult(id);
}
async function saveConsult(id){

 c.reason=$('#cs_reason').value;c.durationMin=parseInt($('#cs_dur').value)||0;

}
async function closeConsult(id){

async function saveCDEntry(){
 const type=$('#cd_type').value;
 const drug=$('#cd_drug').value.trim();if(!drug){toast('drug required');return}
 const amt=parseFloat($('#cd_amt').value);if(!amt||amt<=0){toast('amount required');return}
 const e={id:'cd_'+uuid(),firmId:state.firm.id,ts:new Date($('#cd_date').value||fmtDate(now())).getTime(),
 entryType:type,drug,strength:$('#cd_str').value,schedule:$('#cd_sched').value,
 amount:amt,unit:$('#cd_unit').value,batchNo:$('#cd_batch').value,
 recordedBy:state.activeClinicianId,recordedAt:now()};
 if(type==='received'){
 e.supplier=$('#cd_sup').value;e.invoiceNo=$('#cd_inv').value;e.authSig=$('#cd_auth').value;
 if(!e.supplier||!e.authSig){toast('supplier + auth vet required');return}
 } else if(type==='dispensed'){
 e.animalId=$('#cd_animal').value;e.rxId=$('#cd_rx').value;
 e.witness1=$('#cd_wit1').value;e.witness2=$('#cd_wit2').value;
 if(!e.animalId||!e.witness1||!e.witness2){toast('animal + 2 witnesses required');return}
 if(e.witness1===e.witness2){toast('witnesses must be different');return}
 } else {
 e.destroyedReason=$('#cd_dr').value;e.destroyedMethod=$('#cd_dm').value;
 e.witness1=$('#cd_dw1').value;e.witness2=$('#cd_dw2').value;
 if(!e.destroyedReason||!e.destroyedMethod||!e.witness1||!e.witness2){toast('reason + method + 2 witnesses required');return}
 if(e.witness1===e.witness2){toast('two-witness rule: witnesses must be different');return}
 }
 await idbPut('controlledDrugRegister',e);
 await auditPut('controlled-drug.entry',type+' · '+drug,{id:e.id});
 broadcast('controlled-drug.entry',e);await loadAll();
 closeModal();toast('CD entry recorded');render();
}

// ── T0 patterns · 14 rules ──
const T0_RULES=[
 {match:/rcvs.*(code|professional conduct)|code of professional conduct/i,
 answer:()=>'RCVS Code of Professional Conduct sets out the 10 Principles of Practice for Veterinary Surgeons. Key duties: (1) put animal welfare first; (2) maintain professional knowledge & competence; (3) be open & honest with clients; (4) maintain confidentiality (with limited exceptions, e.g. public-health duty); (5) keep accurate clinical records (s.6.1 — append-only, signed); (6) cooperate with RCVS investigations; (7) only practise within competence; (8) report concerns about colleagues; (9) avoid conflicts of interest; (10) treat clients fairly. Breach can trigger Disciplinary Committee referral. The Code is supported by 28 chapters of supporting guidance.\n\nNot legal advice — verify against current RCVS Code.'},
 {match:/pss.*(core|gp|hospital|module|level)|practice standards scheme.*(level|module)/i,
 answer:()=>'RCVS Practice Standards Scheme has three accreditation modules:\n\n• **Core** — baseline: RCVS-registered premises, basic equipment, medicines mgmt per VMR, H&S, infection control, CPD records, complaints process. ~150 standards.\n\n• **General Practice** — Core + dedicated consult rooms, in-house lab capability, recovery facilities, 24/7 emergency cover (own or contracted), surgical/autoclave logs, anaesthesia monitoring, basic imaging. ~250 standards.\n\n• **Veterinary Hospital** — GP + 24/7 staffed hospitalisation, dedicated theatre, advanced imaging (US min), in-house haem+biochem, isolation, specialist referral capability. ~350 standards.\n\nPlus optional **Species modules**: Small Animal, Equine, Farm Animal. **4-year audit cycle** with interim assessment. Not legal advice — see RCVS PSS Manual.'},
 {match:/vmr|cascade|off.label|veterinary medicines regulations/i,
 answer:()=>'The **Veterinary Medicines Regulations 2013** (as amended) set the prescribing cascade. Order:\n\n1. UK-licensed veterinary medicine for the species & condition\n2. UK-licensed veterinary medicine for a different species or condition\n3. UK-licensed human medicine, OR an EU-licensed vet medicine (under SIC)\n4. Extemporaneous (specially compounded) preparation\n\nOff-label use **MUST** be documented in clinical record with: clinical justification, owner consent (informed), withdrawal period (if food-producing — default minima: 7d milk, 28d meat, 500dd fish), and notification to owner of risk. The cascade is a personal professional decision by the prescribing vet. Breach = VMD/RCVS sanction. Not legal advice — VMD Cascade guidance.'},
 {match:/schedule.*(2|two|ii).*cd|controlled drug.*(register|schedule)|cd.*register|misuse of drugs/i,
 answer:()=>'**Schedule 2 controlled drugs** (e.g. methadone, pethidine, fentanyl, morphine, ketamine [Sch 2 in some forms]) require statutory register (Misuse of Drugs Regs 2001, r.19):\n\n• Bound book OR computerised system (with audit trail, daily back-up, 2-yr retention from last entry)\n• Separate page per drug + strength + form\n• Entries within 24 hr of transaction (in chronological order, indelible ink, no alterations)\n• Each entry: date, name + address of supplier/recipient, quantity, form & strength\n• Receipt entries: also batch no, invoice no\n• Dispensing entries: animal + owner + Rx ref + vet signature + (best practice) witness signature\n• Stock check & balance reconciliation at intervals\n• 5-yr retention from last entry of the book (UK Home Office)\n\nSchedule 3 (e.g. tramadol, buprenorphine, midazolam) — no register required but **invoices retained 2 yr**. Both: stored in locked CD cabinet per Misuse of Drugs (Safe Custody) Regs 1973.\n\nNot legal advice — verify with VMD CD guidance.'},
 {match:/(two|2).?witness|witness.*destr|destruction.*witness|denatur/i,
 answer:()=>'**Two-witness rule for CD destruction** — Misuse of Drugs Regs 2001 r.27 (as amended by Controlled Drugs (Supervision of Management & Use) Regs 2013).\n\nWhen destroying Schedule 2 CDs (expired, damaged, returned by client):\n\n1. Two **independent** witnesses required — typically one **Authorised Witness** (e.g. RCVS Specialist, designated person from PCT/equivalent, accountable officer) plus the registered manager OR another vet\n2. Drug must be **denatured** before disposal — broken down so unrecoverable (CD denaturing kit, kitty litter + water + bleach)\n3. Place in sealed pharmaceutical waste bag (DOOP — Disposal of Old Pharmaceuticals)\n4. Both witnesses sign the CD register **destruction entry** with date, drug name, strength, quantity, form, reason, method\n5. Disposal via licensed clinical waste contractor\n\nWitnesses must not be the same person. Register entry retained 2 yr from date. Not legal advice — VMD + Home Office CD guidance.'},
 {match:/microchip.*(cat|england|mandatory|2024|date)/i,
 answer:()=>'**Cats in England** — microchipping became mandatory **10 June 2024** under the Microchipping of Cats and Dogs (England) Regulations 2023. All cats aged 20 weeks or older must be microchipped and registered on a DEFRA-compliant database. Owner failure → 21-day notice then **£500 fine**.\n\n**Dogs in England** — mandatory since **6 April 2016** (Microchipping of Dogs (England) Regulations 2015). Same enforcement.\n\nApproved databases: Petlog, MicrochipCentral, Identibase, Animal Microchips, Smarttrac, Pet ID, ProtectedPet. Vet duties: implant correctly, record + verify chip no, advise owner on database registration & keeping contact details current. Scotland/Wales/NI have separate legislation. Not legal advice — DEFRA + RCVS guidance.'},
 {match:/withdrawal.*period|food.producing|farm.*medicine|residue/i,
 answer:()=>'**Withdrawal period** = minimum time between last administration of a vet medicine to a food-producing animal and slaughter / milk / egg collection, to ensure residues are below MRL (Maximum Residue Limit).\n\nFor licensed UK veterinary medicines: as stated on the SPC / data sheet.\n\nFor **cascade off-label use** in food-producing species, statutory minima (VMR 2013):\n• **Eggs:** 7 days\n• **Milk:** 7 days\n• **Meat (mammals + poultry):** 28 days\n• **Fish:** 500 degree-days (Σ daily mean water temp °C × days)\n\nVet must inform farmer in writing of WP, record on Veterinary Medicines Record (farm-side). Some active substances are **banned** in food-producing animals (chloramphenicol, dimetridazole, metronidazole, nitrofurans, etc — Annex IV of EU Reg 470/2009 as retained). Not legal advice.'},
 {match:/ahc|animal health cert|eu travel|pet travel|post.brexit/i,
 answer:()=>'**Animal Health Certificate (AHC)** — required for non-commercial EU travel of dogs, cats and ferrets since 1 Jan 2021 (replaces EU Pet Passport for GB pets).\n\n• Issued by an **Official Veterinarian (OV)** — vet with OV qualification (LVI registered with APHA)\n• Animal must be: microchipped (before vaccination), rabies-vaccinated (≥21 days before travel, valid 3 yr if booster maintained), and (Finland/Ireland/Malta/Norway) tapeworm-treated 24-120 hr before entry\n• Valid for **single trip** — 10 days entry to EU + 4 months onward EU travel + 4 months return to GB\n• Cost typically £100-£200 per trip\n• Issued via APHA portal — practice retains evidence in records\n\nGB Pet Passports issued before 1 Jan 2021 are **invalid** for EU travel (still valid for GB→NI). NI pet owners can still get EU Pet Passport. Not legal advice — APHA + RCVS guidance.'},

 {match:/animal welfare act|duty of care.*animal|2006/i,
 answer:()=>'**Animal Welfare Act 2006** (England & Wales; Animal Health & Welfare Scotland Act 2006; Welfare of Animals Act NI 2011) — primary animal welfare statute.\n\n**s.9 Duty of care** — person responsible must take reasonable steps to ensure 5 welfare needs are met:\n1. Suitable environment\n2. Suitable diet\n3. Ability to exhibit normal behaviour patterns\n4. Housed with or apart from other animals appropriately\n5. Protection from pain, suffering, injury and disease\n\n**s.4 Unnecessary suffering** — offence to cause / permit unnecessary suffering (max 5 yr custody since Animal Welfare (Sentencing) Act 2021).\n\nVet duties: assess welfare in every consult, report concerns (BVA + RCVS welfare reporting guidance), liaise with RSPCA / Local Authority where appropriate. Confidentiality may be breached in public interest / animal-welfare emergencies.\n\nNot legal advice.'},

 answer:()=>'**Antimicrobial Stewardship** — RCVS + BVA + VMD priority since 2014 (UK 5-yr AMR Action Plan; UK 20-yr Vision).\n\nKey principles for vets:\n\n• **Diagnose first** — culture & sensitivity where possible, especially for repeat/failed treatment\n• **Use HP-CIA (Highest-Priority Critically Important Antimicrobials) only when no alternative**: 3rd/4th-gen cephalosporins, fluoroquinolones, polymyxins (colistin)\n• Colistin — should not be used in animals (last-resort human antibiotic)\n• **Prophylactic / metaphylactic** use minimised — only with clear justification\n• Record indication, dose, duration on Rx + clinical record\n• **PROTECT ME** posters (small animal) — BSAVA guidance\n• Reduce empirical use via practice antibiotic policy + annual review of usage data\n• Owner education on full course completion + non-sharing\n\nUK total vet antibiotic sales fell 59% (2014–2022). Target: continued reduction. Not legal advice — VMD UK-VARSS reports.'},

// THE GATED AUDIT CHAIN — inlined verbatim by build-page.mjs: the shared kernel from fallhardened
// plus this repo own byte layout. Scoped in a closure so its names cannot collide with the app.
// Do not edit between the markers: edit the kernel, re-run the gate, rebuild the page.
// ════════════════════════════════════════════════════════════════
const AUDITCHAIN=(function(){
/* __AUDIT_KERNEL__ */
// audit-chain.mjs — a tamper-evident log that can actually be checked.
//
// ⚑ WHY THIS EXISTS. Nine tools in this estate write a hash-linked audit log — clinic, vet, HR,
// recruitment, claims, legal, insurance, books, practice — and not one of them ever re-walked it.
// prevHash and docHash were written on every action and never read back, so the tamper-evidence was
// a claim about the data rather than a property of it. A regulator asking "prove this was not edited"
// would have been handed a log that could not answer.
//
// ⚑ AND WHY IT IS A FACTORY. The bug underneath the bug is that a writer and a verifier can disagree
// about WHICH BYTES were signed, and then a check passes that should not — or fails when nothing is
// wrong. Here both come out of one call and close over the same `payloadOf`, so they cannot drift.
// You cannot construct a verifier for one layout and a writer for another by accident.
//
// The byte layout itself is deliberately NOT fixed: the nine tools each sign different fields, and
// forcing one shape would either break their existing logs or quietly re-define what was signed.

/** The hash a chain starts from. An empty string, so the first entry has nothing behind it. */
const GENESIS = '';

const isFn = (f) => typeof f === 'function';

/**
 * Build a chain that can write and check its own entries.
 *
 * @param opts.sha256    async (string) => hex digest. Injected so this stays pure and testable.
 * @param opts.payloadOf (prevHash, entry, index) => string — exactly the bytes that get signed.
 */
function auditChain(opts) {
  // A default parameter does not fire on an explicit null, and null is what a caller reading a
  // missing config hands you. Normalise, then read.
  const o = (opts && typeof opts === 'object') ? opts : {};
  const sha256 = o.sha256;
  const payloadOf = o.payloadOf;
  if (!isFn(sha256)) throw new Error('auditChain needs a sha256(string) function');
  if (!isFn(payloadOf)) throw new Error('auditChain needs a payloadOf(prevHash, entry, index) function');

  /**
   * The hash the next entry must link to.
   *
   * The last row is read defensively because a corrupt log is exactly when this gets called: a null
   * or non-object at the end used to throw here, which turned "your audit log has a bad row" into
   * "the app crashed while trying to write an audit entry".
   */
  function headOf(entries) {
    const log = Array.isArray(entries) ? entries : [];
    if (!log.length) return GENESIS;
    const last = log[log.length - 1];
    if (!last || typeof last !== 'object') return GENESIS;
    return String(last.docHash ?? '');
  }

  /**
   * Seal an entry onto the end of the log. Returns a NEW entry carrying prevHash and docHash —
   * it does not mutate what it was given, because an audit writer that edits its input is the
   * first thing anyone should distrust.
   */
  async function append(entries, entry) {
    const log = Array.isArray(entries) ? entries : [];
    const prevHash = headOf(log);
    const i = log.length;
    const base = { ...(entry && typeof entry === 'object' ? entry : {}), i, prevHash };
    const docHash = await sha256(payloadOf(prevHash, base, i));
    return { ...base, docHash };
  }

  /**
   * Walk the log and report the FIRST entry that does not reproduce. The earliest break is when the
   * tampering happened; everything after it is just that break's wake, so reporting later ones would
   * bury the answer.
   *
   * `expectHead` is optional and closes the one hole a chain cannot close on its own — see below.
   */
  async function verify(entries, checkOpts) {
    const log = Array.isArray(entries) ? entries : [];
    const c = (checkOpts && typeof checkOpts === 'object') ? checkOpts : {};
    let prev = GENESIS;

    for (let i = 0; i < log.length; i++) {
      const e = (log[i] && typeof log[i] === 'object') ? log[i] : {};
      if (String(e.prevHash ?? '') !== prev) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry does not link to the one before it — something was inserted, removed or reordered' };
      }
      const expected = await sha256(payloadOf(prev, e, i));
      if (expected !== e.docHash) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry was altered after it was written' };
      }
      prev = e.docHash;
    }

    // ⚑ THE HONEST BOUND. A chain proves nothing was changed or removed from the MIDDLE. Delete the
    // last few entries and what remains is a perfectly valid chain — the log simply looks shorter.
    // The only defence is knowing what the head should be, from somewhere the editor could not reach.
    // Without expectHead this returns ok:true and SAYS the tail is unproven, rather than implying a
    // completeness it cannot demonstrate.
    if (c.expectHead != null) {
      if (String(c.expectHead) !== prev) {
        return { ok: false, brokeAt: log.length, id: null, entries: log.length,
                 reason: 'the log ends earlier than it should — entries were removed from the end' };
      }
      return { ok: true, entries: log.length, tailProven: true,
               reason: 'every entry reproduces its own hash, and the log ends where it was expected to' };
    }

    return {
      ok: true, entries: log.length, tailProven: false,
      reason: log.length
        ? 'every entry reproduces its own hash — but nothing here can prove entries were not removed from the END; keep the head hash somewhere separate to close that'
        : 'the log is empty',
    };
  }

  return { append, verify, headOf, payloadOf };
}


// audit.mjs — fallvet's audit layout, and the chain built from it.
//
// ⚑ THE BYTES MUST NOT CHANGE. There are logs in the wild signed by the old inline writer:
//     sha256(lastAuditHash + ts + action + adviserId + payloadStr)
// If this layout differs by one character, every entry a practice has already written stops
// reproducing and the verifier reports the whole history as tampered. Making a real audit trail
// look forged is a worse outcome than not checking it at all, so the layout below is a faithful
// copy of the original and a test pins it against a literal expected string.
//
// The chain semantics live in the shared, separately-gated audit-chain kernel. Only the byte layout
// is this repo's business.

/**
 * Exactly what the old writer hashed, in the same order. `clinicianId` is the field the entry
 * carries; the original read it from state as `adviserId` before storing it under that name.
 */
function payloadOf(prevHash, entry) {
  const e = (entry && typeof entry === 'object') ? entry : {};
  return String(prevHash == null ? '' : prevHash)
    + String(e.ts ?? '')
    + String(e.action ?? '')
    + String(e.clinicianId ?? '')
    + JSON.stringify(e.payload ?? {});
}

/** The writer and the checker, from one call, over one layout. */
function makeAuditChain(sha256) {
  return auditChain({ sha256, payloadOf });
}
